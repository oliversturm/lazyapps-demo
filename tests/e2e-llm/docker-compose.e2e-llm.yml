services:
  mongo:
    image: mongo:latest
    restart: unless-stopped

  rabbit:
    image: rabbitmq:latest
    restart: unless-stopped

  command-processor:
    build: ../../packages/llm-demo/command-processor
    restart: unless-stopped
    depends_on:
      - mongo
      - rabbit
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      RABBIT_URL: 'amqp://rabbit'
      LOG_LEVEL: 'warn'

  change-notifier:
    build: ../../packages/llm-demo/change-notifier
    restart: unless-stopped
    environment:
      EXPRESS_PORT: '80'
      LOG_LEVEL: 'warn'

  readmodel-customers:
    build: ../../packages/llm-demo/readmodel-customers
    restart: unless-stopped
    depends_on:
      - mongo
      - rabbit
      - change-notifier
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-customers'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LOG_LEVEL: 'warn'

  readmodel-orders:
    build: ../../packages/llm-demo/readmodel-orders
    restart: unless-stopped
    depends_on:
      - mongo
      - rabbit
      - change-notifier
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-orders'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LLM_MOCK: 'false'
      LLM_API_KEY: '${LLM_API_KEY}'
      LLM_BASE_URL: '${LLM_BASE_URL}'
      LLM_MODEL: '${LLM_MODEL}'
      LOG_LEVEL: 'warn'

  readmodel-events:
    build: ../../packages/llm-demo/readmodel-events
    restart: unless-stopped
    depends_on:
      - mongo
      - rabbit
      - change-notifier
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-events'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LOG_LEVEL: 'warn'

  frontend:
    build: ../../packages/llm-demo/frontend
    restart: unless-stopped
    depends_on:
      - command-processor
      - readmodel-customers
      - readmodel-orders
      - readmodel-events
      - change-notifier
    environment:
      VITE_RM_CUSTOMERS_URL: 'http://readmodel-customers'
      VITE_RM_ORDERS_URL: 'http://readmodel-orders'
      VITE_COMMAND_URL: 'http://command-processor/api/command'
      VITE_CHANGENOTIFIER_URL: 'http://change-notifier'
      RM_CUSTOMERS_URL: 'http://readmodel-customers'
      RM_ORDERS_URL: 'http://readmodel-orders'
      RM_EVENTS_URL: 'http://readmodel-events'
      LLM_MOCK: 'false'
      LLM_API_KEY: '${LLM_API_KEY}'
      LLM_BASE_URL: '${LLM_BASE_URL}'
      LLM_MODEL: '${LLM_MODEL}'
      SVELTE_HOST: '0.0.0.0'

  playwright:
    build: .
    depends_on:
      - frontend
    ipc: host
    environment:
      CI: 'true'
