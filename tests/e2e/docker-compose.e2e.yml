services:
  # Monolith stack
  mongo-monolith:
    image: mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  monolith:
    build:
      dockerfile: tests/e2e/Dockerfile.monolith
      context: ../..
      network: host
    depends_on:
      mongo-monolith:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3005/api/admin/replayStatus/_healthcheck',r=>{r.resume();if(r.statusCode>=500){process.exit(1)}require('http').get('http://localhost:5173/',r2=>{r2.resume();process.exit(r2.statusCode>=400?1:0)}).on('error',()=>process.exit(1))}).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    environment:
      MONGO_URL: 'mongodb://mongo-monolith:27017'
      VITE_CHANGENOTIFIER_URL: 'http://monolith:53008'
      SVELTE_HOST: '0.0.0.0'
      LOG_LEVEL: 'warn'
      ADMIN_PORT: '3005'
      ORIGIN: 'http://monolith:3005'
      ADMIN_COMMAND_PROCESSOR_URL: 'http://monolith:3005'
      ADMIN_READ_MODEL_SERVICES: '{"monolith":"http://monolith:3005"}'

  # Orchestrated stack
  mongo:
    image: mongo:latest
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbit:
    image: rabbitmq:latest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  command-processor:
    build:
      context: ../../packages/orchestrated/command-processor
      network: host
    depends_on:
      mongo:
        condition: service_healthy
      rabbit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/',r=>{r.resume();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      RABBIT_URL: 'amqp://rabbit'
      LOG_LEVEL: 'warn'

  readmodel-customers:
    build:
      context: ../../packages/orchestrated/readmodel-customers
      network: host
    depends_on:
      mongo:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      change-notifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/',r=>{r.resume();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-customers'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LOG_LEVEL: 'warn'

  readmodel-orders:
    build:
      context: ../../packages/orchestrated/readmodel-orders
      network: host
    depends_on:
      mongo:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      change-notifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/',r=>{r.resume();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-orders'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LOG_LEVEL: 'warn'

  change-notifier:
    build:
      context: ../../packages/orchestrated/change-notifier
      network: host
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:80/',r=>{r.resume();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      EXPRESS_PORT: '80'
      LOG_LEVEL: 'warn'

  frontend-svelte:
    build:
      context: ../../packages/orchestrated/frontend-svelte
      network: host
    depends_on:
      command-processor:
        condition: service_healthy
      readmodel-customers:
        condition: service_healthy
      readmodel-orders:
        condition: service_healthy
      change-notifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/',r=>{r.resume();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    environment:
      VITE_RM_CUSTOMERS_URL: 'http://readmodel-customers'
      VITE_RM_ORDERS_URL: 'http://readmodel-orders'
      VITE_COMMAND_URL: 'http://command-processor/api/command'
      VITE_CHANGENOTIFIER_URL: 'http://change-notifier'

  admin-ui:
    build:
      context: ../../packages/orchestrated/admin-ui
      network: host
    depends_on:
      command-processor:
        condition: service_healthy
      readmodel-customers:
        condition: service_healthy
      readmodel-orders:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/',r=>{r.resume();process.exit(r.statusCode>=500?1:0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    environment:
      ORIGIN: 'http://admin-ui:3000'
      ADMIN_COMMAND_PROCESSOR_URL: 'http://command-processor'
      ADMIN_READ_MODEL_SERVICES: '{"readmodel-customers":"http://readmodel-customers","readmodel-orders":"http://readmodel-orders"}'

  frontend-react:
    build:
      context: ../../packages/orchestrated/frontend-react
      network: host
    depends_on:
      command-processor:
        condition: service_healthy
      readmodel-customers:
        condition: service_healthy
      readmodel-orders:
        condition: service_healthy
      change-notifier:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5173/',r=>{r.resume();process.exit(0)}).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    environment:
      VITE_RM_CUSTOMERS_URL: 'http://readmodel-customers'
      VITE_RM_ORDERS_URL: 'http://readmodel-orders'
      VITE_COMMAND_URL: 'http://command-processor/api/command'
      VITE_CHANGENOTIFIER_URL: 'http://change-notifier'

  # Playwright test runner
  playwright:
    build:
      context: .
      network: host
    depends_on:
      monolith:
        condition: service_healthy
      frontend-svelte:
        condition: service_healthy
      frontend-react:
        condition: service_healthy
      admin-ui:
        condition: service_healthy
    ipc: host
    environment:
      CI: 'true'
