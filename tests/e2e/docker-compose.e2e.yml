networks:
  e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  # Monolith stack
  mongo-monolith:
    image: mongo:latest
    networks:
      - e2e

  monolith:
    build:
      dockerfile: tests/e2e/Dockerfile.monolith
      context: ../..
    depends_on:
      - mongo-monolith
    environment:
      MONGO_URL: 'mongodb://mongo-monolith:27017'
      VITE_CHANGENOTIFIER_URL: 'http://monolith:53008'
      SVELTE_HOST: '0.0.0.0'
      LOG_LEVEL: 'warn'
    networks:
      - e2e

  # Traefik reverse proxy (orchestrated stack only)
  traefik:
    image: traefik:3.1.2
    command:
      - '--log=true'
      - '--log.level=WARN'
      - '--api.insecure=true'
      - '--providers.file=true'
      - '--providers.file.filename=/etc/traefik/dynamic.yml'
      - '--entrypoints.web.address=:80'
    volumes:
      - ../../packages/orchestrated/traefik.e2e.yml:/etc/traefik/dynamic.yml:ro
    networks:
      e2e:
        ipv4_address: 172.28.0.100

  # Orchestrated infrastructure
  mongo:
    image: mongo:latest
    networks:
      - e2e

  rabbit:
    image: rabbitmq:latest
    networks:
      - e2e

  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: 'http://127.0.0.1:8200'
      VAULT_DEV_ROOT_TOKEN_ID: 'dev-root-token'
      VAULT_DEV_LISTEN_ADDRESS: '0.0.0.0:8200'
    healthcheck:
      test: ['CMD', 'vault', 'status']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - e2e

  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: 'http://vault:8200'
      VAULT_TOKEN: 'dev-root-token'
    entrypoint: /bin/sh
    command: ['/vault-init.sh']
    volumes:
      - ../../packages/orchestrated/vault-init.sh:/vault-init.sh:ro
    restart: 'no'
    networks:
      - e2e

  command-processor:
    build:
      context: ../../packages/orchestrated
      dockerfile: command-processor/Dockerfile
    depends_on:
      mongo:
        condition: service_started
      rabbit:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      RABBIT_URL: 'amqp://rabbit'
      LOG_LEVEL: 'warn'
      VAULT_ADDR: 'http://vault:8200'
      VAULT_ROLE_ID: 'command-processor-role-id'
      VAULT_SECRET_ID: 'command-processor-secret-id'
    networks:
      - e2e

  readmodel-customers:
    build:
      context: ../../packages/orchestrated
      dockerfile: readmodel-customers/Dockerfile
    depends_on:
      mongo:
        condition: service_started
      rabbit:
        condition: service_started
      change-notifier:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-customers'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LOG_LEVEL: 'warn'
      VAULT_ADDR: 'http://vault:8200'
      VAULT_ROLE_ID: 'readmodel-customers-role-id'
      VAULT_SECRET_ID: 'readmodel-customers-secret-id'
    networks:
      - e2e

  readmodel-orders:
    build:
      context: ../../packages/orchestrated
      dockerfile: readmodel-orders/Dockerfile
    depends_on:
      mongo:
        condition: service_started
      rabbit:
        condition: service_started
      change-notifier:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    environment:
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-orders'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LOG_LEVEL: 'warn'
      VAULT_ADDR: 'http://vault:8200'
      VAULT_ROLE_ID: 'readmodel-orders-role-id'
      VAULT_SECRET_ID: 'readmodel-orders-secret-id'
    networks:
      - e2e

  change-notifier:
    build: ../../packages/orchestrated/change-notifier
    environment:
      EXPRESS_PORT: '80'
      LOG_LEVEL: 'warn'
    networks:
      - e2e

  frontend-svelte:
    build: ../../packages/orchestrated/frontend-svelte
    depends_on:
      - command-processor
      - readmodel-customers
      - readmodel-orders
      - change-notifier
    environment:
      VITE_RM_CUSTOMERS_URL: 'http://rm-customers.localhost'
      VITE_RM_ORDERS_URL: 'http://rm-orders.localhost'
      VITE_COMMAND_URL: 'http://commands.localhost/api/command'
      VITE_CHANGENOTIFIER_URL: 'http://change-notifier.localhost'
    networks:
      - e2e

  frontend-react:
    build: ../../packages/orchestrated/frontend-react
    depends_on:
      - command-processor
      - readmodel-customers
      - readmodel-orders
      - change-notifier
    environment:
      VITE_RM_CUSTOMERS_URL: 'http://rm-customers.localhost'
      VITE_RM_ORDERS_URL: 'http://rm-orders.localhost'
      VITE_COMMAND_URL: 'http://commands.localhost/api/command'
      VITE_CHANGENOTIFIER_URL: 'http://change-notifier.localhost'
    networks:
      - e2e

  # Playwright test runner
  playwright:
    build: .
    depends_on:
      - monolith
      - frontend-svelte
      - frontend-react
      - traefik
    ipc: host
    extra_hosts:
      - 'svelte.localhost:172.28.0.100'
      - 'react.localhost:172.28.0.100'
      - 'commands.localhost:172.28.0.100'
      - 'rm-customers.localhost:172.28.0.100'
      - 'rm-orders.localhost:172.28.0.100'
      - 'change-notifier.localhost:172.28.0.100'
    environment:
      CI: 'true'
    networks:
      - e2e
