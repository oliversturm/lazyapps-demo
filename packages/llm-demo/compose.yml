x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: 'http://${OTLP_HOST:-dashboard}:${OTLP_PORT:-18889}'
  OTEL_EXPORTER_OTLP_PROTOCOL: 'grpc'
  OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=lazyapps-llm-demo,deployment.environment.name=development'

services:
  traefik:
    image: traefik:3.1.2
    command:
      - '--log=true'
      - '--log.level=INFO'
      - '--accesslog=true'
      - '--api.insecure=true'
      - '--providers.file=true'
      - '--providers.file.filename=/etc/traefik/dynamic.yml'
      - '--tracing.otlp=true'
      - '--tracing.otlp.grpc.endpoint=${OTLP_HOST:-dashboard}:${OTLP_PORT:-18889}'
      - '--tracing.otlp.grpc.insecure=true'
      - '--entrypoints.web.address=:80'
    ports:
      - '80:80'
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik.yml:/etc/traefik/dynamic.yml

  mongo:
    image: mongo:latest

  rabbit:
    image: rabbitmq:latest

  # Aspire Dashboard
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: 'true'

  # --- Application services (added incrementally) ---

  command-processor:
    build: ./command-processor
    depends_on:
      - mongo
      - rabbit
    volumes:
      - ./command-records:/command-records:consistent
    develop:
      watch:
        - action: sync
          path: ./command-processor
          target: /app
    environment:
      <<: *otel-env
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      RABBIT_URL: 'amqp://rabbit'
      LOG_LEVEL: 'trace'
      COMMAND_RECORD_PATH: '/command-records'
      OTEL_SERVICE_NAME: 'command-processor'

  change-notifier:
    build: ./change-notifier
    develop:
      watch:
        - action: sync
          path: ./change-notifier
          target: /app
    environment:
      <<: *otel-env
      EXPRESS_PORT: '80'
      LOG_LEVEL: 'trace'
      OTEL_SERVICE_NAME: 'change-notifier'

  readmodel-customers:
    build: ./readmodel-customers
    depends_on:
      - mongo
      - rabbit
      - change-notifier
    develop:
      watch:
        - action: sync
          path: ./readmodel-customers
          target: /app
    environment:
      <<: *otel-env
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-customers'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LOG_LEVEL: 'trace'
      OTEL_SERVICE_NAME: 'readmodel-customers'

  readmodel-orders:
    build: ./readmodel-orders
    depends_on:
      - mongo
      - rabbit
      - change-notifier
      - llm-service
    develop:
      watch:
        - action: sync
          path: ./readmodel-orders
          target: /app
    environment:
      <<: *otel-env
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-orders'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LLM_SERVICE_URL: 'http://llm-service'
      LOG_LEVEL: 'trace'
      OTEL_SERVICE_NAME: 'readmodel-orders'

  readmodel-events:
    build: ./readmodel-events
    depends_on:
      - mongo
      - rabbit
      - change-notifier
    develop:
      watch:
        - action: sync
          path: ./readmodel-events
          target: /app
    environment:
      <<: *otel-env
      EXPRESS_PORT: '80'
      MONGO_URL: 'mongodb://mongo:27017'
      MONGO_DATABASE: 'readmodel-events'
      RABBIT_URL: 'amqp://rabbit'
      CHANGENOTIFICATION_FETCH_URL: 'http://change-notifier/change'
      COMMAND_URL: 'http://command-processor/api/command'
      LOG_LEVEL: 'trace'
      OTEL_SERVICE_NAME: 'readmodel-events'

  frontend:
    build: ./frontend
    depends_on:
      - command-processor
      - readmodel-customers
      - readmodel-orders
      - change-notifier
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules/
    environment:
      VITE_RM_CUSTOMERS_URL: 'http://rm-customers.localhost'
      VITE_RM_ORDERS_URL: 'http://rm-orders.localhost'
      VITE_COMMAND_URL: 'http://commands.localhost/api/command'
      VITE_CHANGENOTIFIER_URL: 'http://change-notifier.localhost'
      VITE_LLM_URL: 'http://llm.localhost'

  llm-service:
    build: ./llm-service
    depends_on:
      - readmodel-customers
      - readmodel-orders
      - readmodel-events
    develop:
      watch:
        - action: sync
          path: ./llm-service
          target: /app
    environment:
      <<: *otel-env
      EXPRESS_PORT: '80'
      LLM_API_KEY: '${LLM_API_KEY:-}'
      LLM_BASE_URL: '${LLM_BASE_URL:-}'
      LLM_MODEL: '${LLM_MODEL:-gpt-4o}'
      LLM_MOCK: '${LLM_MOCK:-true}'
      LOG_LEVEL: 'trace'
      OTEL_SERVICE_NAME: 'llm-service'
      RM_CUSTOMERS_URL: 'http://readmodel-customers'
      RM_ORDERS_URL: 'http://readmodel-orders'
      RM_EVENTS_URL: 'http://readmodel-events'
