http:
  routers:
    commands:
      rule: "Host(`commands.localhost`)"
      entrypoints:
        - web
      service: commands

    rm-customers:
      rule: "Host(`rm-customers.localhost`)"
      entrypoints:
        - web
      service: rm-customers

    rm-orders:
      rule: "Host(`rm-orders.localhost`)"
      entrypoints:
        - web
      service: rm-orders

    rm-events:
      rule: "Host(`rm-events.localhost`)"
      entrypoints:
        - web
      service: readmodel-events

    change-notifier:
      rule: "Host(`change-notifier.localhost`)"
      entrypoints:
        - web
      service: change-notifier

    frontend:
      rule: "Host(`llm-demo.localhost`)"
      entrypoints:
        - web
      service: frontend

    dashboardUI:
      rule: "Host(`dashboardUI.localhost`)"
      entrypoints:
        - web
      service: dashboardUI

  services:
    commands:
      loadBalancer:
        servers:
          - url: "http://command-processor:80"

    rm-customers:
      loadBalancer:
        servers:
          - url: "http://readmodel-customers:80"

    rm-orders:
      loadBalancer:
        servers:
          - url: "http://readmodel-orders:80"

    readmodel-events:
      loadBalancer:
        servers:
          - url: "http://readmodel-events:80"

    change-notifier:
      loadBalancer:
        servers:
          - url: "http://change-notifier:80"

    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:5173"

    dashboardUI:
      loadBalancer:
        servers:
          - url: "http://dashboard:18888"
