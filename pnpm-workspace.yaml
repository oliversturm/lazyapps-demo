packages:
  - 'packages/**'

# Supply-chain policy: current pnpm enforces a minimum release age for
# newly published packages by default. Branch snapshots of our own scope
# are minutes old by design — exempt them, keep the check for 3rd parties.
minimumReleaseAgeExclude:
  - '@lazyapps/*'

# === @lazyapps snapshot overrides (managed by scripts/use-branch-packages.js) ===
# pnpm >= 11 no longer reads the `pnpm` field from package.json, so @lazyapps
# snapshot overrides live here. `pnpm run use-branch <branch>` rewrites this
# block; `pnpm run use-released` restores it to this committed baseline.
overrides:
  '@lazyapps/admin-api': '1.0.0-branch-admin-replay-20260317173929'
  '@lazyapps/admin-ui': '0.2.0-branch-admin-replay-20260317173929'
